name: Release

# Builds macOS binaries and attaches them to a GitHub Release when a version
# tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allows a manual dry run (builds, but publishes nothing)

permissions:
  contents: write

jobs:
  build:
    # macOS 14 runners are Apple Silicon; the x86_64 slice is cross-compiled
    # here, which is why one job can produce every artifact.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Build (arm64, x86_64, universal)
        run: |
          set -eu
          mkdir -p dist
          for arch in arm64 x86_64; do
            triple="$arch-apple-macosx11.0"
            swift build -c release --product bosectl --triple "$triple"
            cp "$(swift build -c release --triple "$triple" --show-bin-path)/bosectl" "dist/bosectl-macos-$arch"
            strip -x "dist/bosectl-macos-$arch"
          done
          lipo -create -output dist/bosectl-macos-universal dist/bosectl-macos-arm64 dist/bosectl-macos-x86_64

      - name: Verify artifacts
        run: |
          set -eu
          for f in dist/*; do
            printf '%s: %s\n' "$f" "$(lipo -archs "$f")"
          done
          # The runner is arm64, so this slice must run here.
          ./dist/bosectl-macos-arm64 --version
          ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: bosectl-macos
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          cd dist
          shasum -a 256 bosectl-macos-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" \
            --title "bosectl $version" \
            --generate-notes \
            dist/bosectl-macos-arm64 \
            dist/bosectl-macos-x86_64 \
            dist/bosectl-macos-universal \
            dist/SHA256SUMS.txt
